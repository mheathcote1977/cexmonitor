name: Validate ReefAPI access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cex-monitor-state
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Validate read-only ReefAPI search
        env:
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
        run: npm run probe
