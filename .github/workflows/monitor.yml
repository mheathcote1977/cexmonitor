name: CeX monitor
on:
  schedule:
    - cron: '0 9,11,13,15,17,19 * * *'
      timezone: Europe/London
    # Temporary credit-free scheduler diagnostic; removed after verification.
    - cron: '25 17 31 10 *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only probe or monitor
        type: choice
        options: [probe, monitor]
        default: probe
permissions:
  contents: read
concurrency:
  group: cex-monitor-state
  cancel-in-progress: false
jobs:
  scheduler-diagnostic:
    if: github.event_name == 'schedule' && github.event.schedule == '25 17 31 10 *'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Confirm automatic scheduling without secrets or API calls
        run: |
          echo 'Automatic GitHub schedule event received. No ReefAPI calls or Telegram messages.'
          date -u
          echo 'Automatic schedule trigger confirmed; zero ReefAPI credits used.' >> "$GITHUB_STEP_SUMMARY"
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false') && (github.event_name != 'schedule' || github.event.schedule == '0 9,11,13,15,17,19 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check UK monitoring hours
        id: hours
        run: |
          node --input-type=module -e "import { inMonitoringWindow } from './src/monitor.ts'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_OUTPUT, 'allowed=' + inMonitoringWindow(new Date()) + '\n');"
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Read-only access probe
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        env:
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
        run: npm run probe
      - name: Monitor
        if: (github.event_name == 'schedule' || inputs.mode == 'monitor') && steps.hours.outputs.allowed == 'true'
        env:
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED || 'true' }}
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run monitor
