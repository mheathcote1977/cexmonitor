name: CeX monitor
on:
  schedule:
    - cron: '7 8-19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only probe or monitor
        type: choice
        options: [probe, monitor]
        default: probe
permissions:
  contents: read
concurrency:
  group: cex-monitor-state
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check UK monitoring hours
        id: hours
        run: |
          node --input-type=module -e "import { inMonitoringWindow } from './src/monitor.ts'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_OUTPUT, 'allowed=' + inMonitoringWindow(new Date()) + '\n');"
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Read-only access probe
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        env:
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
        run: npm run probe
      - name: Monitor
        if: (github.event_name == 'schedule' || inputs.mode == 'monitor') && steps.hours.outputs.allowed == 'true'
        env:
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED || 'true' }}
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run monitor
